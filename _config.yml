# ---------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------
title: Kavi
author: Kabindra Sony
description: >-
  Kabindra Sony (Kavi) — graduate student in biophysics at Kyoto University,
  working on protein dynamics. Writing on science and becoming a scientist.
lang: en

url: https://thisizkavi-lab.github.io
baseurl: /kavi-web          # set to "" if you move to a custom domain

# Shown in the footer. Remove any line to hide it.
social:
  email: thisizkavi@gmail.com
  github: thisizkavi-lab
  x: kvindra__
  youtube: "@kavi-youtube"

# Used by jekyll-seo-tag for link previews (X, Slack, etc.)
twitter:
  username: kvindra__
image: /assets/img/profile.jpg

# ---------------------------------------------------------------
# Sections
# A post's section comes from its folder:
#   blog/_posts/2026-10-03-my-post.md      -> /blog/my-post/
#   thoughts/_posts/2026-10-03-my-post.md  -> /thoughts/my-post/
# To add lectures later, uncomment it here and create lectures/_posts/.
# Every section listed here appears in the menu, even before its first post.
# ---------------------------------------------------------------
sections:
  - name: blog
    title: Blog
    blurb: Things I learn, work through, and explain.
  - name: thoughts
    title: Thoughts
    blurb: On science, ambition, and becoming a scientist.
  # - name: lectures
  #   title: Lectures
  #   blurb: Recorded talks and lectures.

permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/profile.jpg
  - scope:
      type: posts
    values:
      layout: post

# ---------------------------------------------------------------
# Build
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) / \[ \] — rendered by KaTeX when `math: true`
  syntax_highlighter: rouge
  footnote_backlink: "↩︎"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
