name: Build and deploy al-folio

on:
  push:
    branches: [main, al-folio-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build GitHub Pages output
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site-github

      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site-github

      - name: Build Vercel output
        if: github.ref == 'refs/heads/main'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "" --destination _site-vercel

      - name: Set up Node for Vercel CLI
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish the root-relative build to Vercel
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel deployment skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as GitHub Actions secrets."
            exit 0
          fi
          npm install --global vercel@48.10.2
          vercel deploy _site-vercel --prod --yes --token="$VERCEL_TOKEN"
